# ============================================================================
#  UHI Viewer — lightweight version: frontend + prediction only.
#  The full FIWARE platform (Orion-LD, GeoServer, ingestion, training)
#  lives on the `main` branch.
# ============================================================================

# Logging configuration for all services
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # UHI prediction API (XGBoost on user-drawn zones + live sensors)
  prediction:
    build:
      context: ./services/prediction
      dockerfile: Dockerfile
    container_name: uhi-prediction
    restart: unless-stopped
    environment:
      - DATA_PROCESSED_PATH=/data/processed
      - MODEL_PATH=/data/models
    volumes:
      - ./data/processed:/data/processed:ro
      - ./data/models:/data/models:ro
    networks:
      - uhi-network
    mem_limit: 4g
    cpus: "1.5"
    pids_limit: 256
    logging: *default-logging

  # Frontend - Cesium + Vue.js viewer, map tiles and API gateway (nginx)
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        # Le token Cesium DOIT être injecté au build, sinon la 3D casse en prod.
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN}
    container_name: uhi-frontend
    restart: unless-stopped
    environment:
      # Runtime only: written into the nginx config, never sent to the browser
      - CARTO_API_KEY=${CARTO_API_KEY:?CARTO_API_KEY must be set in .env}
    volumes:
      - ./data/tiles:/usr/share/nginx/tiles:ro
    depends_on:
      - prediction
    networks:
      - uhi-network
    mem_limit: 256m
    logging: *default-logging

  # Caddy reverse proxy for HTTPS and ACME certificate management
  caddy:
    image: caddy:2-alpine
    container_name: uhi-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # necessary for ACME certificate renewal + redirection to 443
      - "443:443"   # HTTPS traffic
    environment:
      - DOMAIN=${DOMAIN}
      - TLS_EMAIL=${TLS_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # stores certificates (to keep between restarts!)
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - uhi-network
    mem_limit: 256m
    logging: *default-logging

networks:
  uhi-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
