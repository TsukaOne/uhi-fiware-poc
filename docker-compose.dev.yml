services:
  geoserver:
    ports:
      - "127.0.0.1:8080:8080"   # cible du proxy Vite /geoserver

  orion:
    ports:
      - "127.0.0.1:1026:1026"   # cible du proxy Vite /orion

  prediction:
    ports:
      - "127.0.0.1:8002:8000"   # cible du proxy Vite /prediction

  ingestion:
    ports:
      - "127.0.0.1:8001:8000"   # API d'ingestion (debug manuel)

  frontend:
    ports:
      - "127.0.0.1:3000:80"     # build de prod servi par nginx, pour comparer
