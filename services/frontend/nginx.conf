# ============================================================================
#  nginx frontend — sreverse proxy for SPA + API gateway
#
# ============================================================================

# --- Rate limiting (must be in http context, so here, AFTER the server block) ---
limit_req_zone  $binary_remote_addr zone=api:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;         
    client_max_body_size 1m;    

    # --- Real IP from reverse proxy (Caddy) ---
    # nginx is only reachable from Caddy on the Docker private network
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ======================= SPA =======================
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always; # headers security
        add_header X-Frame-Options        "SAMEORIGIN" always; # headers security 
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always; # headers security
    }

    # ========================= ORION — only GET =========================
    # That's it: the SPA only makes these 2 requests. Everything else (POST/PATCH/DELETE) is refused.

    # Temperature sendsors list
    location = /orion/ngsi-ld/v1/entities {
        limit_except GET OPTIONS { deny all; }
        limit_req zone=api burst=10 nodelay;
        limit_conn addr 20;
        proxy_pass http://orion:1026/ngsi-ld/v1/entities;   # la query string est transmise automatiquement
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # 2) UHI model entity (color scale) 
    location = /orion/ngsi-ld/v1/entities/urn:ngsi-ld:UHIHeatMap:XGBoost:brussels:2024 {
        limit_except GET OPTIONS { deny all; }
        limit_req zone=api burst=10 nodelay;
        limit_conn addr 20;
        proxy_pass http://orion:1026/ngsi-ld/v1/entities/urn:ngsi-ld:UHIHeatMap:XGBoost:brussels:2024;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Refused everything else for Orion
    location /orion/ { return 404; }

    # ====================== PREDICTION — POST Only ======================

    location = /prediction/predict/pixel/value {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=api burst=10 nodelay;  limit_conn addr 10;
        proxy_pass http://prediction:8000/predict/pixel/value;
        proxy_set_header Host $host;  proxy_read_timeout 120s;
    }
    location = /prediction/predict/layer/stats {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=api burst=10 nodelay;  limit_conn addr 10;
        proxy_pass http://prediction:8000/predict/layer/stats;
        proxy_set_header Host $host;  proxy_read_timeout 120s;
    }
    location = /prediction/predict/zone/stats {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=api burst=10 nodelay;  limit_conn addr 10;
        proxy_pass http://prediction:8000/predict/zone/stats;
        proxy_set_header Host $host;  proxy_read_timeout 120s;
    }
    location = /prediction/predict/zone {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=api burst=5 nodelay;  limit_conn addr 5;
        proxy_pass http://prediction:8000/predict/zone;
        proxy_set_header Host $host;  proxy_read_timeout 300s;   # une prédiction de zone peut être longue
    }
    location = /prediction/predict/download {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=api burst=5 nodelay;  limit_conn addr 5;
        proxy_pass http://prediction:8000/predict/download;
        proxy_set_header Host $host;  proxy_read_timeout 300s;
    }

    # Everything else is refused
    location /prediction/ { return 404; }

    # ======================= GEOSERVER — GET only =======================
   
    location ~ ^/geoserver/(web|rest|console|gwc/rest|wps|j_spring_security_check) {
        return 404;
    }

    # WMS (map tiles): Cesium requests a lot, so we allow more connections, but no write.
    location /geoserver/ {
        limit_except GET HEAD OPTIONS { deny all; }
        limit_conn addr 40;
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
